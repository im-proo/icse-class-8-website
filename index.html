<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICSE Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:      #0a0c14;
    --bg-mid:       #0f1220;
    --glass-bg:     rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.09);
    --glass-hover:  rgba(255,255,255,0.07);
    --accent:       #7c9cff;
    --accent-soft:  rgba(124,156,255,0.15);
    --accent-glow:  rgba(124,156,255,0.08);
    --correct:      #4ade80;
    --correct-soft: rgba(74,222,128,0.12);
    --wrong:        #f87171;
    --wrong-soft:   rgba(248,113,113,0.12);
    --text-primary: rgba(255,255,255,0.92);
    --text-secondary: rgba(255,255,255,0.52);
    --text-muted:   rgba(255,255,255,0.28);
    --radius:       14px;
    --radius-sm:    8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* subtle static gradient orbs — CSS only, zero JS, zero extra RAM */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(80,100,220,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 90%, rgba(100,60,200,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── PAGE LOAD FADE ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page-load { animation: fadeUp 0.55s ease both; }
  .page-load-delay { animation: fadeUp 0.55s 0.12s ease both; }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 10;
    padding: 36px 48px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .site-title span {
    color: var(--accent);
  }

  .header-badge {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 5px 12px;
    border-radius: 100px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* ── SUBJECT + CHAPTER NAVIGATION ── */
  nav {
    position: relative;
    z-index: 10;
    padding: 28px 48px 0;
  }

  .subject-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .subject-tab {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 8px 20px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.01em;
  }

  .subject-tab:hover {
    background: var(--glass-hover);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }

  .subject-tab.active {
    background: var(--accent-soft);
    border-color: rgba(124,156,255,0.35);
    color: var(--accent);
  }

  .chapter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chapter-tab {
    font-size: 0.76rem;
    font-weight: 400;
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .chapter-tab:hover {
    color: var(--text-secondary);
    border-color: rgba(255,255,255,0.12);
  }

  .chapter-tab.active {
    background: var(--glass-bg);
    border-color: rgba(255,255,255,0.14);
    color: var(--text-primary);
  }

  /* ── DIVIDER ── */
  .nav-divider {
    position: relative;
    z-index: 10;
    margin: 20px 48px 0;
    height: 1px;
    background: var(--glass-border);
  }

  /* ── MAIN CONTENT ── */
  main {
    position: relative;
    z-index: 10;
    padding: 32px 48px 64px;
    max-width: 1100px;
  }

  .section-block { display: none; }
  .section-block.visible { display: block; }

  .section-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--glass-border);
    letter-spacing: 0.01em;
  }

  .questions-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 36px;
  }

  /* ── GLASS CARD ── */
  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    transition: border-color 0.2s ease;
  }

  .card:hover { border-color: rgba(255,255,255,0.14); }

  /* ── MCQ CARD ── */
  .mcq-card .card-q {
    padding: 18px 20px 14px;
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.6;
  }

  .mcq-options {
    padding: 0 20px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .mcq-opt {
    font-size: 0.82rem;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    line-height: 1.4;
  }

  .mcq-opt:hover:not(.disabled) {
    background: var(--glass-hover);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }

  .mcq-opt.correct {
    background: var(--correct-soft);
    border-color: rgba(74,222,128,0.3);
    color: var(--correct);
  }

  .mcq-opt.wrong {
    background: var(--wrong-soft);
    border-color: rgba(248,113,113,0.3);
    color: var(--wrong);
  }

  .mcq-opt.disabled { cursor: default; }

  .mcq-feedback {
    padding: 0 20px 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
    display: none;
  }
  .mcq-feedback.show { display: block; }

  /* ── FILL IN THE BLANK CARD ── */
  .fitb-card .card-q {
    padding: 18px 20px 12px;
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.7;
  }

  .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 1.5px solid var(--accent);
    color: transparent;
    background: var(--accent-glow);
    border-radius: 3px;
    padding: 1px 8px;
    margin: 0 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    vertical-align: middle;
    font-size: 0.88rem;
    user-select: none;
  }

  .blank.revealed {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: rgba(124,156,255,0.4);
  }

  .fitb-hint {
    padding: 0 20px 14px;
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  /* ── TRUE / FALSE CARD ── */
  .tf-card .card-q {
    padding: 18px 20px 12px;
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.6;
  }

  .tf-buttons {
    padding: 0 20px 18px;
    display: flex;
    gap: 10px;
  }

  .tf-btn {
    font-size: 0.82rem;
    padding: 8px 22px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: 'Inter', sans-serif;
  }

  .tf-btn:hover:not(.disabled) {
    background: var(--glass-hover);
    color: var(--text-primary);
  }

  .tf-btn.correct {
    background: var(--correct-soft);
    border-color: rgba(74,222,128,0.3);
    color: var(--correct);
  }

  .tf-btn.wrong {
    background: var(--wrong-soft);
    border-color: rgba(248,113,113,0.3);
    color: var(--wrong);
  }

  .tf-btn.disabled { cursor: default; }

  .tf-note {
    padding: 0 20px 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
    display: none;
  }
  .tf-note.show { display: block; }

  /* ── SHORT / LONG ANSWER CARD ── */
  .qa-card { cursor: pointer; }

  .qa-card .card-q {
    padding: 18px 20px 16px;
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.6;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .reveal-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    margin-top: 2px;
  }

  .reveal-icon svg {
    width: 10px;
    height: 10px;
    fill: var(--text-muted);
    transition: transform 0.25s ease;
  }

  .qa-card.open .reveal-icon svg { transform: rotate(180deg); }
  .qa-card.open .reveal-icon {
    background: var(--accent-soft);
    border-color: rgba(124,156,255,0.3);
  }
  .qa-card.open .reveal-icon svg { fill: var(--accent); }

  .card-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .card-answer.open { max-height: 1200px; }

  .answer-inner {
    padding: 0 20px 18px;
    border-top: 1px solid var(--glass-border);
    margin: 0 0 0;
  }

  .answer-inner p, .answer-inner li {
    font-size: 0.87rem;
    color: var(--text-secondary);
    line-height: 1.75;
    margin-top: 10px;
  }

  .answer-inner ul, .answer-inner ol {
    padding-left: 18px;
  }

  .answer-inner li { margin-top: 6px; }

  .answer-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 100px;
    padding: 3px 10px;
    margin-top: 12px;
    letter-spacing: 0.03em;
  }

  /* ── ASSERTION REASON CARD ── */
  .ar-card { cursor: pointer; }

  .ar-card .card-q {
    padding: 18px 20px 14px;
  }

  .ar-assertion {
    font-size: 0.87rem;
    color: var(--text-primary);
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .ar-reason {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius-sm);
    border-left: 2px solid var(--glass-border);
  }

  .ar-reveal-row {
    padding: 10px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ar-reveal-btn {
    font-size: 0.78rem;
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: 'Inter', sans-serif;
  }

  .ar-reveal-btn:hover { background: var(--glass-hover); color: var(--text-primary); }

  .ar-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 20px;
  }

  .ar-answer.open {
    max-height: 200px;
    padding-bottom: 16px;
  }

  .ar-answer-pill {
    display: inline-block;
    font-size: 0.82rem;
    color: var(--correct);
    background: var(--correct-soft);
    border: 1px solid rgba(74,222,128,0.2);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    line-height: 1.5;
  }

  /* ── MATCH THE FOLLOWING ── */
  .match-container {
    padding: 16px 20px 20px;
  }

  .match-title {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    letter-spacing: 0.03em;
  }

  .match-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px 0;
    align-items: center;
  }

  .match-left, .match-right {
    font-size: 0.84rem;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text-primary);
    line-height: 1.4;
  }

  .match-connector {
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .match-line {
    width: 20px;
    height: 1px;
    background: var(--glass-border);
    margin: 0 auto;
    transition: background 0.3s ease;
  }

  .match-pair.revealed .match-line {
    background: var(--accent);
  }

  .match-pair.revealed .match-left,
  .match-pair.revealed .match-right {
    border-color: rgba(124,156,255,0.25);
    background: var(--accent-glow);
  }

  .match-reveal-btn {
    margin-top: 14px;
    font-size: 0.78rem;
    padding: 7px 18px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: 'Inter', sans-serif;
  }

  .match-reveal-btn:hover { background: var(--glass-hover); color: var(--text-primary); }
  .match-reveal-btn.revealed { color: var(--accent); border-color: rgba(124,156,255,0.3); background: var(--accent-glow); }

  /* ── ODD ONE OUT ── */
  .odd-card .card-q {
    padding: 16px 20px 12px;
    font-size: 0.87rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .odd-options {
    padding: 0 20px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .odd-opt {
    font-size: 0.82rem;
    padding: 7px 16px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: 'Inter', sans-serif;
  }

  .odd-opt:hover:not(.disabled) { background: var(--glass-hover); color: var(--text-primary); }
  .odd-opt.correct { background: var(--correct-soft); border-color: rgba(74,222,128,0.3); color: var(--correct); }
  .odd-opt.wrong   { background: var(--wrong-soft);   border-color: rgba(248,113,113,0.3); color: var(--wrong); }
  .odd-opt.disabled { cursor: default; }

  .odd-reason {
    padding: 0 20px 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
    display: none;
  }
  .odd-reason.show { display: block; }

  /* ── DEFINE CARD ── */
  .def-card { cursor: pointer; }

  .def-card .card-q {
    padding: 16px 20px;
    font-size: 0.9rem;
    color: var(--text-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .def-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .def-answer.open { max-height: 300px; }

  .def-answer-inner {
    padding: 12px 20px 18px;
    border-top: 1px solid var(--glass-border);
    font-size: 0.86rem;
    color: var(--text-secondary);
    line-height: 1.75;
  }

  /* ── CHAPTER NOT SELECTED ── */
  .empty-state {
    display: none;
    padding: 60px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  .empty-state.show { display: block; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  @media (max-width: 700px) {
    header, nav { padding-left: 20px; padding-right: 20px; }
    main { padding: 24px 20px 48px; }
    .mcq-options { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr auto 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .page-load, .page-load-delay { animation: none; }
    .card-answer, .ar-answer, .def-answer { transition: none; }
  }
</style>
</head>
<body>

<header class="page-load">
  <div class="site-title">ICSE <span>Notes</span></div>
  <div class="header-badge">Class 8</div>
</header>

<nav class="page-load-delay">
  <div class="subject-tabs" id="subjectTabs"></div>
  <div class="chapter-tabs" id="chapterTabs"></div>
</nav>

<div class="nav-divider page-load-delay"></div>

<main id="mainContent" class="page-load-delay">
  <div class="empty-state show" id="emptyState">Select a subject and chapter above to begin.</div>
</main>

<script>
// ════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════
const DATA = {
  "Civics": {
    "The Judiciary": [
      // ── A. MCQ
      { type:"mcq", q:"Which jurisdiction allows the Supreme Court to be approached directly?", opts:["Appellate Jurisdiction","Original Jurisdiction","Advisory Jurisdiction","Writ Jurisdiction"], ans:1 },

      { type:"mcq", q:"What is the retirement age for High Court judges?", opts:["60 years","65 years","70 years","62 years"], ans:3 },

      // ── B. Assertion & Reason

      // ── D. Match the Following
      { type:"match", title:"Match the Following", pairs:[

//  STATE
// ════════════════════════════════════════════════
let currentSubject = null;
let currentChapter = null;

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
function init() {
  const subjectTabsEl = document.getElementById('subjectTabs');
  Object.keys(DATA).forEach(subj => {
    const btn = document.createElement('button');
    btn.className = 'subject-tab';
    btn.textContent = subj;
    btn.onclick = () => selectSubject(subj);
    subjectTabsEl.appendChild(btn);
  });
}

function selectSubject(subj) {
  currentSubject = subj;
  currentChapter = null;

  document.querySelectorAll('.subject-tab').forEach(b => b.classList.toggle('active', b.textContent === subj));

  const chapterTabsEl = document.getElementById('chapterTabs');
  chapterTabsEl.innerHTML = '';
  Object.keys(DATA[subj]).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-tab';
    btn.textContent = ch;
    btn.onclick = () => selectChapter(subj, ch);
    chapterTabsEl.appendChild(btn);
  });

  document.getElementById('mainContent').innerHTML = '<div class="empty-state show" id="emptyState">Select a chapter above.</div>';
}

function selectChapter(subj, ch) {
  currentChapter = ch;
  document.querySelectorAll('.chapter-tab').forEach(b => b.classList.toggle('active', b.textContent === ch));
  renderChapter(DATA[subj][ch]);
}

// ════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════
function renderChapter(items) {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  // group by type
  const groups = [
    { label:"Multiple Choice Questions",  types:["mcq"],   items:[] },
    { label:"Assertion & Reason",          types:["ar"],    items:[] },
    { label:"Fill in the Blanks",          types:["fitb"],  items:[] },
    { label:"Match the Following",         types:["match"], items:[] },
    { label:"True or False",               types:["tf"],    items:[] },
    { label:"Odd One Out",                 types:["odd"],   items:[] },
    { label:"Definitions",                 types:["def"],   items:[] },
    { label:"Questions & Answers",         types:["qa"],    items:[] },
  ];

  items.forEach(item => {
    for (const g of groups) {
      if (g.types.includes(item.type)) { g.items.push(item); break; }
    }
  });

  groups.forEach(g => {
    if (!g.items.length) return;
    const block = document.createElement('div');
    block.className = 'section-block visible';

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = g.label;
    block.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'questions-grid';

    g.items.forEach((item, i) => {
      let card;
      if (item.type === 'mcq')   card = buildMCQ(item, i);
      if (item.type === 'ar')    card = buildAR(item, i);
      if (item.type === 'fitb')  card = buildFITB(item, i);
      if (item.type === 'match') card = buildMatch(item, i);
      if (item.type === 'tf')    card = buildTF(item, i);
      if (item.type === 'qa')    card = buildQA(item, i);
      if (item.type === 'odd')   card = buildOdd(item, i);
      if (item.type === 'def')   card = buildDef(item, i);
      if (card) grid.appendChild(card);
    });

    block.appendChild(grid);
    main.appendChild(block);
  });
}

// ── MCQ
function buildMCQ(item, idx) {
  const uid = 'mcq-' + idx + '-' + Math.random().toString(36).slice(2,6);
  const card = el('div', 'card mcq-card');
  const qDiv = el('div', 'card-q');
  qDiv.textContent = (idx+1) + '. ' + item.q;
  card.appendChild(qDiv);

  const opts = el('div', 'mcq-options');
  const labels = ['(a)','(b)','(c)','(d)'];
  const feedback = el('div', 'mcq-feedback');

  item.opts.forEach((opt, oi) => {
    const btn = el('button', 'mcq-opt');
    btn.textContent = labels[oi] + ' ' + opt;
    btn.dataset.idx = oi;
    btn.onclick = function() {
      if (card.dataset.done) return;
      card.dataset.done = '1';
      card.querySelectorAll('.mcq-opt').forEach(b => {
        const bi = parseInt(b.dataset.idx);
        b.classList.add('disabled');
        if (bi === item.ans) b.classList.add('correct');
        else if (bi === oi && bi !== item.ans) b.classList.add('wrong');
      });
      feedback.textContent = oi === item.ans ? '✓ Correct!' : '✗ The correct answer is ' + labels[item.ans] + ' ' + item.opts[item.ans];
      feedback.classList.add('show');
    };
    opts.appendChild(btn);
  });

  card.appendChild(opts);
  card.appendChild(feedback);
  return card;
}

// ── ASSERTION & REASON
function buildAR(item, idx) {
  const card = el('div', 'card ar-card');
  const qDiv = el('div', 'card-q');

  const aLine = el('div', 'ar-assertion');
  aLine.textContent = 'Assertion (A): ' + item.a;
  const rLine = el('div', 'ar-reason');
  rLine.textContent = 'Reason (R): ' + item.r;
  qDiv.appendChild(aLine);
  qDiv.appendChild(rLine);
  card.appendChild(qDiv);

  const row = el('div', 'ar-reveal-row');
  const btn = el('button', 'ar-reveal-btn');
  btn.textContent = 'Show answer';
  row.appendChild(btn);
  card.appendChild(row);

  const ansDiv = el('div', 'ar-answer');
  const pill = el('div', 'ar-answer-pill');
  pill.textContent = item.ans;
  ansDiv.appendChild(pill);
  card.appendChild(ansDiv);

  btn.onclick = () => {
    const open = ansDiv.classList.toggle('open');
    btn.textContent = open ? 'Hide answer' : 'Show answer';
  };

  return card;
}

// ── FILL IN THE BLANK
function buildFITB(item, idx) {
  const card = el('div', 'card fitb-card');
  const qDiv = el('div', 'card-q');

  const parts = item.q.split('________');
  parts.forEach((part, i) => {
    qDiv.appendChild(document.createTextNode(part));
    if (i < parts.length - 1) {
      const blankEl = el('span', 'blank');
      blankEl.dataset.answer = item.blank;
      blankEl.textContent = item.blank;
      blankEl.setAttribute('aria-label', 'Click to reveal: ' + item.blank);
      blankEl.onclick = () => blankEl.classList.toggle('revealed');
      qDiv.appendChild(blankEl);
    }
  });

  card.appendChild(qDiv);
  const hint = el('div', 'fitb-hint');
  hint.textContent = 'Click the blank to reveal the answer.';
  card.appendChild(hint);
  return card;
}

// ── MATCH THE FOLLOWING
function buildMatch(item, idx) {
  const card = el('div', 'card');
  const container = el('div', 'match-container');

  const title = el('div', 'match-title');
  title.textContent = item.title;
  container.appendChild(title);

  const grid = el('div', 'match-grid');
  const pairs = [];

  item.pairs.forEach((pair, i) => {
    const leftEl = el('div', 'match-left');
    leftEl.textContent = pair.left;
    const connEl = el('div', 'match-connector');
    const lineEl = el('div', 'match-line');
    connEl.appendChild(lineEl);
    const rightEl = el('div', 'match-right');
    rightEl.textContent = pair.right;

    grid.appendChild(leftEl);
    grid.appendChild(connEl);
    grid.appendChild(rightEl);
    pairs.push({ left: leftEl, conn: connEl, right: rightEl });
  });

  container.appendChild(grid);

  let revealed = false;
  const btn = el('button', 'match-reveal-btn');
  btn.textContent = 'Reveal all matches';
  btn.onclick = () => {
    revealed = !revealed;
    grid.querySelectorAll('.match-left, .match-right, .match-connector').forEach((el, i) => {
      const row = Math.floor(i / 3);
      const rowEl = grid.children[row * 3];
      const pairDiv = { left: grid.children[row*3], conn: grid.children[row*3+1], right: grid.children[row*3+2] };
    });
    // Reveal all pairs
    let i = 0;
    item.pairs.forEach(() => {
      [grid.children[i*3], grid.children[i*3+1], grid.children[i*3+2]].forEach(node => {
        if (revealed) node.classList.add('revealed');
        else node.classList.remove('revealed');
      });
      i++;
    });
    btn.textContent = revealed ? 'Hide matches' : 'Reveal all matches';
    btn.classList.toggle('revealed', revealed);
  };

  container.appendChild(btn);
  card.appendChild(container);
  return card;
}

// ── TRUE / FALSE
function buildTF(item, idx) {
  const card = el('div', 'card tf-card');
  const qDiv = el('div', 'card-q');
  qDiv.textContent = (idx+1) + '. ' + item.q;
  card.appendChild(qDiv);

  const btns = el('div', 'tf-buttons');
  const noteEl = el('div', 'tf-note');

  ['True','False'].forEach(label => {
    const btn = el('button', 'tf-btn');
    btn.textContent = label;
    btn.onclick = () => {
      if (card.dataset.done) return;
      card.dataset.done = '1';
      const chosen = label === 'True';
      const correct = item.ans;
      card.querySelectorAll('.tf-btn').forEach(b => {
        b.classList.add('disabled');
        if (b.textContent === 'True' && correct) b.classList.add('correct');
        else if (b.textContent === 'False' && !correct) b.classList.add('correct');
        else if (b.textContent === label) b.classList.add('wrong');
      });
      if (item.note) { noteEl.textContent = item.note; noteEl.classList.add('show'); }
    };
    btns.appendChild(btn);
  });

  card.appendChild(btns);
  card.appendChild(noteEl);
  return card;
}

// ── Q & A
function buildQA(item, idx) {
  const card = el('div', 'card qa-card');

  const qDiv = el('div', 'card-q');
  const qText = el('span');
  qText.textContent = item.q;
  const icon = el('div', 'reveal-icon');
  icon.innerHTML = `<svg viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg"><path d="M1 1l4 4 4-4"/></svg>`;
  icon.querySelector('svg').style.fill = 'none';
  icon.querySelector('svg').style.stroke = 'rgba(255,255,255,0.4)';
  icon.querySelector('svg').style.strokeWidth = '1.5';
  icon.querySelector('svg').style.strokeLinecap = 'round';
  qDiv.appendChild(qText);
  qDiv.appendChild(icon);
  card.appendChild(qDiv);

  const ansDiv = el('div', 'card-answer');
  const ansInner = el('div', 'answer-inner');

  // Handle multiline answers
  const lines = item.a.split('\n').filter(l => l.trim());
  lines.forEach(line => {
    if (line.startsWith('- ')) {
      const ul = ansInner.lastElementChild?.tagName === 'UL'
        ? ansInner.lastElementChild
        : (() => { const u = el('ul'); ansInner.appendChild(u); return u; })();
      const li = el('li');
      li.textContent = line.slice(2);
      ul.appendChild(li);
    } else {
      const p = el('p');
      p.textContent = line;
      ansInner.appendChild(p);
    }
  });

  ansDiv.appendChild(ansInner);
  card.appendChild(ansDiv);

  card.onclick = () => {
    const open = ansDiv.classList.toggle('open');
    card.classList.toggle('open', open);
  };

  return card;
}

// ── ODD ONE OUT
function buildOdd(item, idx) {
  const card = el('div', 'card odd-card');
  const qDiv = el('div', 'card-q');
  qDiv.textContent = (idx+1) + '. ' + item.q;
  card.appendChild(qDiv);

  const optsEl = el('div', 'odd-options');
  const reason = el('div', 'odd-reason');

  item.opts.forEach((opt, oi) => {
    const btn = el('button', 'odd-opt');
    btn.textContent = opt;
    btn.onclick = () => {
      if (card.dataset.done) return;
      card.dataset.done = '1';
      card.querySelectorAll('.odd-opt').forEach((b, bi) => {
        b.classList.add('disabled');
        if (bi === item.ans) b.classList.add('correct');
        else if (bi === oi && bi !== item.ans) b.classList.add('wrong');
      });
      reason.textContent = item.reason;
      reason.classList.add('show');
    };
    optsEl.appendChild(btn);
  });

  card.appendChild(optsEl);
  card.appendChild(reason);
  return card;
}

// ── DEFINITIONS
function buildDef(item, idx) {
  const card = el('div', 'card def-card');

  const qDiv = el('div', 'card-q');
  const term = el('span');
  term.textContent = item.term;
  const icon = el('div', 'reveal-icon');
  icon.innerHTML = `<svg viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"><path d="M1 1l4 4 4-4"/></svg>`;
  qDiv.appendChild(term);
  qDiv.appendChild(icon);
  card.appendChild(qDiv);

  const defDiv = el('div', 'def-answer');
  const defInner = el('div', 'def-answer-inner');
  defInner.textContent = item.def;
  defDiv.appendChild(defInner);
  card.appendChild(defDiv);

  card.onclick = () => {
    const open = defDiv.classList.toggle('open');
    card.classList.toggle('open', open);
    icon.style.background = open ? 'var(--accent-soft)' : '';
  };

  return card;
}

// ── UTIL
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// ── START
init();
</script>
